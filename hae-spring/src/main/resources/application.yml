# Configuração de produção. Segredos vêm SEMPRE de variáveis de ambiente (ver ../env.example).
spring:
  application:
    name: hae-api
  threads:
    virtual:
      enabled: true
  main:
    banner-mode: off
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hae}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  health:
    # Falha no SMTP não deve derrubar o serviço (o Render reiniciaria a instância).
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

hae:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT2H}
  mail:
    from: ${MAIL_FROM:${SMTP_USERNAME:}}
    feedback-to: ${FEEDBACK_EMAIL:}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  registration:
    allowed-email-domains: ${REGISTRATION_ALLOWED_DOMAINS:}
  admin:
    name: ${INITIAL_ADMIN_NAME:Administrador}
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
  web:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    cookie-name: ${SESSION_COOKIE_NAME:__Host-hae_session}
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
    docs-public: ${API_DOCS_PUBLIC:false}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
