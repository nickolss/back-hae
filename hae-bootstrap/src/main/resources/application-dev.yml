# Perfil de desenvolvimento local. Segredos NUNCA ficam no código: carregue-os do arquivo .env (ver README).
spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}

hae:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from: ${MAIL_FROM:nao-responda@hae.local}
    feedback-to: ${FEEDBACK_EMAIL:suporte@hae.local}
  admin:
    email: ${INITIAL_ADMIN_EMAIL:admin@hae.local}
    password: ${INITIAL_ADMIN_PASSWORD:}
  web:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    cookie-name: hae_session
    cookie-secure: false
    docs-public: true
